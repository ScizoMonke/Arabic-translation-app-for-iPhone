# Builds an UNSIGNED Egypt Talk .ipa on a GitHub macOS runner. AltStore on the
# Windows PC re-signs it with the user's Apple ID. Nothing here needs a secret.
name: ios-build

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash gives -eo pipefail, so `xcodebuild | tee` fails when xcodebuild fails.
    shell: bash

jobs:
  build:
    runs-on: macos-26
    # llama.cpp arrives prebuilt (llama.xcframework, about 70 MB), so the build grows
    # by a download, not a ggml compile; the extra minutes are headroom for it.
    timeout-minutes: 75
    env:
      SCHEME: EgyptTalk
      PROJECT: app/EgyptTalk.xcodeproj
      BUILD_DIR: ${{ github.workspace }}/build
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode 26.6 (falls back to the image default)
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: |
          mkdir -p "$BUILD_DIR"
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$BUILD_DIR/spm" \
            2>&1 | tee "$BUILD_DIR/resolve.log"
          # Proof for the first-run checklist: the llama binary target was fetched,
          # checksum-verified and unpacked to an xcframework with an iOS slice.
          # Informational only (the artifacts layout is Xcode's business); the hard
          # gate is the embedded-framework check in the packaging step.
          find "$BUILD_DIR/spm" -name "llama.xcframework" -print || true
          find "$BUILD_DIR/spm" -path "*ios-arm64/llama.framework/Headers/llama.h" -print | grep -q . \
            || echo "WARNING: llama.xcframework (ios-arm64) not found under $BUILD_DIR/spm after resolve"

      - name: Archive (unsigned, Release, iphoneos)
        run: |
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$BUILD_DIR/EgyptTalk.xcarchive" \
            -clonedSourcePackagesDirPath "$BUILD_DIR/spm" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$BUILD_DIR/archive.log"

      - name: Package .ipa (Payload/EgyptTalk.app zipped)
        run: |
          APP="$BUILD_DIR/EgyptTalk.xcarchive/Products/Applications/EgyptTalk.app"
          test -d "$APP" || { echo "No .app in archive"; ls -R "$BUILD_DIR/EgyptTalk.xcarchive/Products" || true; exit 1; }
          rm -rf "$BUILD_DIR/Payload"
          mkdir -p "$BUILD_DIR/Payload"
          cp -R "$APP" "$BUILD_DIR/Payload/"
          cd "$BUILD_DIR"
          zip -qry EgyptTalk.ipa Payload
          ls -l EgyptTalk.ipa
          # Proof for the first-run checklist: the plist keys the phone depends on.
          plutil -p Payload/EgyptTalk.app/Info.plist | grep -E "CFBundleIdentifier|CFBundleDisplayName|NSMicrophoneUsageDescription|NSSpeechRecognitionUsageDescription|MinimumOSVersion"
          # llama.framework is dynamic: if Xcode did not embed it, the app dies in
          # dyld at launch on the phone. Fail here instead.
          test -f Payload/EgyptTalk.app/Frameworks/llama.framework/llama \
            || { echo "llama.framework is not embedded in EgyptTalk.app/Frameworks"; ls -la Payload/EgyptTalk.app/Frameworks || true; exit 1; }
          ls Payload/EgyptTalk.app/Frameworks
          # The phrasebook is optional (D22); say whether this build carries one.
          if [ -f Payload/EgyptTalk.app/phrasebook.json ]; then
            echo "phrasebook.json bundled ($(wc -c < Payload/EgyptTalk.app/phrasebook.json) bytes)"
          else
            echo "phrasebook.json not bundled: every sentence goes to the model"
          fi
          du -sh Payload/EgyptTalk.app

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: EgyptTalk-ipa
          path: build/EgyptTalk.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: warn
          retention-days: 14
