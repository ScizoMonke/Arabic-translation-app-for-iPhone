# Builds an UNSIGNED Egypt Talk .ipa on a GitHub macOS runner. AltStore on the
# Windows PC re-signs it with the user's Apple ID. Nothing here needs a secret.
name: ios-build

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Explicit bash gives -eo pipefail, so `xcodebuild | tee` fails when xcodebuild fails.
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SCHEME: EgyptTalk
      PROJECT: app/EgyptTalk.xcodeproj
      BUILD_DIR: ${{ github.workspace }}/build
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode 26.6 (falls back to the image default)
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: app
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: |
          mkdir -p "$BUILD_DIR"
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$BUILD_DIR/spm" \
            2>&1 | tee "$BUILD_DIR/resolve.log"

      - name: Archive (unsigned, Release, iphoneos)
        run: |
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$BUILD_DIR/EgyptTalk.xcarchive" \
            -clonedSourcePackagesDirPath "$BUILD_DIR/spm" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$BUILD_DIR/archive.log"

      - name: Package .ipa (Payload/EgyptTalk.app zipped)
        run: |
          APP="$BUILD_DIR/EgyptTalk.xcarchive/Products/Applications/EgyptTalk.app"
          test -d "$APP" || { echo "No .app in archive"; ls -R "$BUILD_DIR/EgyptTalk.xcarchive/Products" || true; exit 1; }
          rm -rf "$BUILD_DIR/Payload"
          mkdir -p "$BUILD_DIR/Payload"
          cp -R "$APP" "$BUILD_DIR/Payload/"
          cd "$BUILD_DIR"
          zip -qry EgyptTalk.ipa Payload
          ls -l EgyptTalk.ipa
          # Proof for the first-run checklist: the plist keys the phone depends on.
          plutil -p Payload/EgyptTalk.app/Info.plist | grep -E "CFBundleIdentifier|CFBundleDisplayName|NSMicrophoneUsageDescription|MinimumOSVersion"
          du -sh Payload/EgyptTalk.app

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: EgyptTalk-ipa
          path: build/EgyptTalk.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: warn
          retention-days: 14
